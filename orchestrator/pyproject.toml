[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sap-orchestrator"
version = "0.2.0-beta"
description = "Multi-system orchestration framework for SAP ecosystems"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.10",
    "httpx>=0.28",
    "opentelemetry-api>=1.26",
    "opentelemetry-sdk>=1.26",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "httpx>=0.28",
    "mypy>=1.11",
    "coverage[toml]>=7.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N999"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/orchestrator"]

[tool.coverage.report]
fail_under = 80
skip_covered = true
