name: CI/CD — SAP Orchestrator

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio coverage
          cd orchestrator && pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check orchestrator/src/orchestrator

      - name: Type check (mypy)
        run: mypy orchestrator/src/orchestrator

      - name: Tests + coverage
        run: |
          cd orchestrator
          pytest tests/ --cov=src/orchestrator --cov-report=xml --cov-fail-under=80

      - name: Upload coverage
        if: success()
        uses: codecov/codecov-action@v4
        with:
          files: orchestrator/coverage.xml
          fail_ci_if_error: false

  build:
    needs: lint-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: orchestrator/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/sap-orchestrator:develop-${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging
        run: echo "Deploy to BTP/Kyma staging here"
